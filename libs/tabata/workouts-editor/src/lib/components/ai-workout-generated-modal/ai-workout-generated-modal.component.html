<ion-header>
    <ion-toolbar>
        <ion-title>Workout generated</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="onDismiss()" aria-label="Close">
                <ion-icon name="close-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <div class="flex flex-col items-center text-center gap-3 py-2">
        <ion-icon name="checkmark-circle-outline" color="success" class="success-icon" aria-hidden="true"></ion-icon>
        <h2 class="text-lg font-semibold m-0">Workout generated successfully</h2>
        <p class="text-sm text-gray-600 m-0 leading-relaxed">
            You can navigate to the workout tabs to edit and save the workout.
        </p>
        <ion-button expand="block" class="w-full mt-2" (click)="onDismiss()">Got it</ion-button>
    </div>
</ion-content>
